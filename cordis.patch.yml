# dsh-tingxue bundle patch：只往 profile 的 roster 里插一行。
# 安装：plugin_manager install_bundle（target = file:D:/oransky/Desktop/oransky/dsh/dsh-tingxue）
# 改这里之后要重启 DSH 才生效。
- insert:
    - id: dsh-tingxue
      name: 'dsh-tingxue'
      config:
        enabled: true
        # 听雪人格提示词（用户自写的 txt）。插件只读、不写。
        personaPath: 'D:\oransky\Desktop\oransky\dsh\dsh-tingxue\听雪档案.txt'
        # 以下为后续阶段要用的开关，S2 阶段先占位、不生效：
        # 记忆服务基址（唯一写者，插件只走 HTTP）
        memoryServiceUrl: 'http://127.0.0.1:8766'
        # 记忆注入档位：off | archive | full（S3 实现）
        memoryRecall: 'full'
        # 关系扩展（S3 实现）
        relationExpand: false
        # 每轮回写记忆（S4 实现）
        memoryWriteBack: false
        # 收工归档触发词（S8 实现）
        archiveKeyword: 'agentout'
