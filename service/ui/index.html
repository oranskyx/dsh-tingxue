<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-mode="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>记忆图谱 · 听雪</title>
<script>
/* 主题尽早落盘，避免首屏闪白/闪黑。规则与 app.js 保持一致：
 * ?theme=light|dark 是显式指定，优先于 localStorage；
 * ?theme=auto（DSH iframe 固定传 auto）则让用户上次的选择生效。 */
(function () {
  try {
    var allowed = ['auto', 'light', 'dark'];
    var search = new URLSearchParams(location.search);
    var fromUrl = search.get('theme');
    var stored = null;
    try { stored = localStorage.getItem('tx-graph-theme'); } catch (e) { stored = null; }
    var explicitUrl = fromUrl === 'light' || fromUrl === 'dark';
    var mode = explicitUrl
      ? fromUrl
      : (allowed.indexOf(stored) >= 0 ? stored : (allowed.indexOf(fromUrl) >= 0 ? fromUrl : 'auto'));
    var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-mode', mode);
  } catch (e) { /* 忽略：交给 app.js 兜底 */ }
})();
</script>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <!-- ===== 顶部栏 ===== -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🕸</span>
      <h1>记忆图谱</h1>
      <span class="brand-sub">听雪</span>
    </div>

    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="搜索实体、关系、记忆…（/ 聚焦）"
             aria-label="搜索实体、关系或记忆" autocomplete="off" spellcheck="false">
      <button id="searchClear" class="search-clear" type="button" title="清除搜索" aria-label="清除搜索" hidden>✕</button>
    </div>

    <div class="seg" id="typeFilter" role="group" aria-label="实体类型过滤">
      <button type="button" data-type="all" aria-pressed="true">全部</button>
      <button type="button" data-type="person" aria-pressed="false">人物</button>
      <button type="button" data-type="place" aria-pressed="false">地点</button>
      <button type="button" data-type="thing" aria-pressed="false">事物</button>
      <button type="button" data-type="concept" aria-pressed="false">概念</button>
    </div>

    <div class="stat-chips" aria-label="记忆库统计">
      <span>记忆 <b id="statMemories">–</b></span>
      <span>实体 <b id="statEntities">–</b></span>
      <span>关系 <b id="statRelations">–</b></span>
    </div>

    <div class="topbar-actions">
      <button id="btnNewEntity" class="btn primary" type="button" title="新增实体">
        <span aria-hidden="true">＋</span><span class="btn-label">新增实体</span>
      </button>
      <button id="btnNewRelation" class="btn" type="button" title="新增关系">
        <span aria-hidden="true">⇄</span><span class="btn-label">新增关系</span>
      </button>
      <button id="btnMerge" class="btn" type="button" title="合并两个实体">
        <span aria-hidden="true">⑃</span><span class="btn-label">合并实体</span>
      </button>
      <button id="btnRefresh" class="btn icon" type="button" title="刷新全部数据" aria-label="刷新全部数据">⟳</button>
      <button id="btnStats" class="btn icon" type="button" title="统计与最近操作" aria-label="统计与最近操作">▤</button>
      <button id="btnTheme" class="btn" type="button" title="切换主题（跟随系统 / 浅色 / 深色）" aria-label="切换主题">
        <span id="themeIcon" aria-hidden="true">◐</span><span id="themeLabel">跟随</span>
      </button>
    </div>
  </header>

  <!-- ===== 工作区 ===== -->
  <main id="workspace">
    <!-- 左侧列表 -->
    <aside id="listPanel" class="panel" aria-label="数据列表">
      <div class="tabs" role="tablist" aria-label="数据分类">
        <button class="tab" type="button" role="tab" data-tab="entities" aria-selected="true">
          实体 <span class="count" id="tabCountEntities">–</span>
        </button>
        <button class="tab" type="button" role="tab" data-tab="relations" aria-selected="false">
          关系 <span class="count" id="tabCountRelations">–</span>
        </button>
        <button class="tab" type="button" role="tab" data-tab="memories" aria-selected="false">
          记忆 <span class="count" id="tabCountMemories">–</span>
        </button>
        <button class="tab" type="button" role="tab" data-tab="trash" aria-selected="false">
          回收站 <span class="count" id="tabCountTrash">–</span>
        </button>
      </div>
      <div class="list-toolbar">
        <span class="hint" id="listHint">加载中…</span>
        <button class="link-btn" id="btnListReload" type="button" title="重新加载当前列表">刷新</button>
      </div>
      <div class="list-body" id="listBody" role="tabpanel" aria-live="polite"></div>
      <button class="load-more" id="btnLoadMore" type="button" hidden>加载更多</button>
    </aside>

    <!-- 中间图谱 -->
    <section id="graphPanel" class="panel" aria-label="关系图谱">
      <div id="graphStage">
        <canvas id="graphCanvas" tabindex="0" aria-label="实体关系图谱画布：滚轮缩放，拖动节点，空白拖动平移，点击选中"></canvas>

        <div class="graph-legend" aria-hidden="true">
          <span><i class="legend-dot person"></i>人物</span>
          <span><i class="legend-dot place"></i>地点</span>
          <span><i class="legend-dot thing"></i>事物</span>
          <span><i class="legend-dot concept"></i>概念</span>
        </div>
        <div class="graph-badge" id="graphBadge">实体 0 · 关系 0</div>

        <div class="graph-controls" role="group" aria-label="图谱视图控制">
          <button id="btnFit" type="button" title="适应视图（显示全部节点）" aria-label="适应视图">⤢</button>
          <button id="btnHome" type="button" title="回到中心并重置缩放" aria-label="回到中心">⌂</button>
          <button id="btnZoomIn" type="button" title="放大" aria-label="放大">＋</button>
          <button id="btnZoomOut" type="button" title="缩小" aria-label="缩小">－</button>
          <button id="btnMinimap" type="button" title="切换小地图模式（缩略图 / 鹰眼）" aria-pressed="false" aria-label="切换小地图模式">◉</button>
        </div>

        <div class="graph-hint">滚轮缩放 · 拖动节点 · 空白拖动平移 · 点击选中</div>

        <div class="graph-overlay" id="graphOverlay">
          <div class="big" aria-hidden="true">🕸</div>
          <div class="state-title">正在加载关系图谱…</div>
          <div class="hint-text">从记忆服务读取实体与关系。</div>
        </div>
      </div>
    </section>

    <!-- 右侧详情 -->
    <aside id="detailPanel" class="panel" aria-label="详情">
      <div id="detailBody" style="display:contents;">
        <div class="detail-empty">
          <div class="state-icon" aria-hidden="true">◎</div>
          <strong>未选择</strong>
          <div>点击左侧列表或画布节点查看详情。<br>实体、关系、记忆都可以在这里编辑与删除。</div>
        </div>
      </div>
    </aside>
  </main>
</div>

<noscript>
  <div style="padding:24px;font-family:sans-serif;">记忆图谱需要启用 JavaScript。</div>
</noscript>

<div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="false"></div>
<div id="modalRoot"></div>

<script src="./graph-engine.js"></script>
<script src="./app.js"></script>
</body>
</html>
